<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Milk Abduction</title>
<link rel="stylesheet" href="style.css" />

<!-- Import map lets us write `import * as THREE from 'three'` without a bundler. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ── Menu overlay ─────────────────────────────────────── -->
<div id="menu">
  <h1 id="menu-title">Milk Abduction</h1>
  <p id="menu-subtitle">a very serious farming simulation</p>

  <div id="lobby">
    <div id="lobby-status">Connecting...</div>
    <ul id="player-list"></ul>
  </div>

  <!-- Button row: Queue + Settings -->
  <div id="menu-buttons">
    <button id="queue-btn" disabled>Connecting...</button>
    <button id="settings-btn">Settings</button>
  </div>

  <div id="countdown-display"></div>
</div>

<!-- ── Settings modal ───────────────────────────────────── -->
<div id="settings-modal" class="hidden">
  <div id="settings-panel">
    <h2>Settings</h2>

    <div class="setting-row">
      <label for="volume-slider">Volume</label>
      <input type="range" id="volume-slider" min="0" max="100" value="70" />
      <span id="volume-value">70%</span>
    </div>

    <div class="setting-row">
      <label for="nudity-toggle">Nudity</label>
      <button id="nudity-toggle" data-on="false">OFF</button>
    </div>

    <button id="settings-close">Close</button>
  </div>
</div>

<!-- ── HUD overlay (visible during gameplay) ────────────── -->
<div id="hud" class="hidden">
  <div id="username">loading…</div>
  <div id="peers">1 online</div>
  <div id="hint">Click to fly · Mouse to steer · WASD to move · Esc to release</div>
</div>

<!-- Portal protocol library — must stay, it's the jam contract -->
<script src="portal.js"></script>

<!-- Our game script -->
<script type="module" src="game.js"></script>
</body>
</html>
